<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ボカロ曲おすすめ検索</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f7f9fb;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #37a2b9;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #37a2b9;
      border-radius: 8px;
      outline: none;
    }
    button.search-btn {
      padding: 12px 20px;
      font-size: 16px;
      background-color: #37a2b9;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button.search-btn:hover {
      background-color: #2c8396;
    }
    
    /* ワードパネル（クイックタグ）のスタイル */
    .word-panel-container {
      margin-bottom: 30px;
    }
    .word-panel-title {
      font-size: 13px;
      color: #777;
      margin-bottom: 8px;
    }
    .word-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      background-color: #ffffff;
      color: #37a2b9;
      border: 1px solid #37a2b9;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .chip:hover {
      background-color: #37a2b9;
      color: #ffffff;
    }

    .results-header {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #e91e63;
    }
    .card {
      background: white;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .song-title {
      font-size: 18px;
      font-weight: bold;
      margin: 0 0 5px 0;
    }
    .artist {
      color: #666;
      font-size: 14px;
      margin: 0 0 10px 0;
    }
    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .tag {
      background-color: #eef7f9;
      color: #2c8396;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <h1>ボカロ曲 雰囲気検索</h1>

  <div class="search-box">
    <input type="text" id="keyword" placeholder="雰囲気やタグを入力（例：明るい、爽やか）">
    <button class="search-btn" onclick="searchSongs()">検索</button>
  </div>

  <!-- 追加したワードパネル領域 -->
  <div class="word-panel-container">
    <div class="word-panel-title">人気のワードから探す：</div>
    <div class="word-panel">
      <button class="chip" onclick="selectWord('明るい')">明るい</button>
      <button class="chip" onclick="selectWord('暗い')">暗い</button>
      <button class="chip" onclick="selectWord('遅い')">遅い</button>
      <button class="chip" onclick="selectWord('早い')">早い</button>
    </div>
  </div>

  <div id="recommend-section" style="display: none;">
    <div class="results-header">✨ あなたへのおすすめ！</div>
    <div id="results"></div>
  </div>

  <script>
    // 手順1で取得したGASのURLをここに貼り付けます
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxnlaIu4Dx5rbthGh1G5NWX23OGQF3hfxyFDp94R_MUFhFaJK-7jD7SSbnR9HPwm1nw/exec";

    // ワードパネルをクリックした時の処理
    function selectWord(word) {
      document.getElementById("keyword").value = word;
      searchSongs(); // 単語をセットしたらそのまま検索を実行
    }

    async function searchSongs() {
      const keyword = document.getElementById("keyword").value;
      if (!keyword.trim()) return;

      const resultsDiv = document.getElementById("results");
      const recommendSection = document.getElementById("recommend-section");
      
      resultsDiv.innerHTML = "検索中...";
      recommendSection.style.display = "block";

      try {
        const response = await fetch(`${GAS_API_URL}?q=${encodeURIComponent(keyword)}`);
        const songs = await response.json();

        resultsDiv.innerHTML = "";

        if (songs.length === 0) {
          resultsDiv.innerHTML = "<p>一致する楽曲が見つかりませんでした。</p>";
          return;
        }

        songs.forEach(song => {
          const card = document.createElement("div");
          card.className = "card";

          const tagsHtml = song.tags.map(t => `<span class="tag">#${t}</span>`).join("");

          card.innerHTML = `
            <h2 class="song-title">${song.title || "（タイトル不明）"}</h2>
            <p class="artist">${song.artist || ""}</p>
            <div class="tag-container">${tagsHtml}</div>
          `;
          resultsDiv.appendChild(card);
        });

      } catch (error) {
        console.error("エラーが発生しました:", error);
        resultsDiv.innerHTML = "<p>検索中にエラーが発生しました。</p>";
      }
    }
  </script>

</body>
</html>
