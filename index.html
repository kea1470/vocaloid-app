<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ボカ Search</title>
  <!-- ロゴ・可愛い日本語用Webフォントの読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
      background-color: #f7f9fb;
      color: #333;
    }

    /* ロゴ風スタイルのタイトル */
    h1.logo-title {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      text-align: center;
      font-size: 42px;
      font-weight: 900;
      margin-bottom: 20px;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #37a2b9 0%, #e91e63 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 2px 4px 8px rgba(0, 0, 0, 0.08);
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s ease;
    }
    h1.logo-title:hover {
      transform: scale(1.02);
    }

    /* モード切り替えボタン */
    .mode-nav {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 30px;
    }
    .mode-btn {
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      background-color: #ffffff;
      color: #37a2b9;
      border: 2px solid #37a2b9;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .mode-btn.active {
      background-color: #37a2b9;
      color: #ffffff;
    }

    /* レイアウト構造 */
    .app-container {
      display: flex;
      gap: 30px;
      align-items: flex-start;
    }
    .left-panel {
      flex: 1;
      min-width: 300px;
    }
    .right-panel {
      flex: 1.2;
      min-width: 320px;
    }

    @media (max-width: 768px) {
      .app-container {
        flex-direction: column;
      }
      .left-panel, .right-panel {
        width: 100%;
      }
      h1.logo-title {
        font-size: 34px;
      }
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #37a2b9;
      border-radius: 8px;
      outline: none;
      background-color: #ffffff;
      color: #555;
      cursor: default;
    }
    button.search-btn {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      background-color: #37a2b9;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    button.search-btn:hover {
      background-color: #2c8396;
    }

    .word-panel-container {
      margin-bottom: 30px;
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .word-panel-title {
      font-size: 14px;
      font-weight: bold;
      color: #555;
      margin-bottom: 10px;
      margin-top: 15px;
    }
    .word-panel-title:first-child {
      margin-top: 0;
    }
    .word-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    @keyframes bounce {
      0% { transform: scale(1); }
      30% { transform: scale(1.25, 0.75); }
      50% { transform: scale(0.85, 1.15) translateY(-6px); }
      70% { transform: scale(1.05, 0.95) translateY(0); }
      100% { transform: scale(1); }
    }

    .chip {
      background-color: #ffffff;
      color: #37a2b9;
      border: 2px solid #37a2b9;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }
    .chip:hover {
      background-color: #eef7f9;
    }
    .chip.active {
      background-color: #37a2b9;
      color: #ffffff;
    }
    .chip.pyon {
      animation: bounce 0.4s ease;
    }

    /* 質問モード中央配置用スタイル */
    .quiz-wrapper {
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
    }

    .selected-tags-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      min-height: 32px;
    }
    .tag-badges-wrapper {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .selected-tag-badge {
      background-color: #eef7f9;
      color: #2c8396;
      border: 1px solid #37a2b9;
      padding: 4px 12px;
      border-radius: 15px;
      font-size: 13px;
      font-weight: bold;
    }

    /* もう一度質問する・戻るボタン */
    .action-sub-btn {
      background-color: #ffffff;
      color: #555;
      border: 1px solid #ccc;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .action-sub-btn:hover {
      background-color: #eee;
      color: #333;
    }

    .quiz-container {
      background: #ffffff;
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      text-align: center;
      margin-bottom: 30px;
    }
    .quiz-question {
      font-size: 22px;
      font-weight: bold;
      color: #2c8396;
      margin-bottom: 25px;
    }
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 420px;
      margin: 0 auto;
    }

    /* 質問ボタンのベーススタイル */
    .quiz-btn {
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
      background-color: #ffffff;
      color: #37a2b9;
      border: 2px solid #37a2b9;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .quiz-btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    /* 質問選択肢の固有カラークラス設定 */
    .btn-color-teal { background-color: #13b5ad; color: #ffffff; border-color: #13b5ad; }
    .btn-color-yellow { background-color: #fbc02d; color: #ffffff; border-color: #fbc02d; }
    .btn-color-red { background-color: #e53935; color: #ffffff; border-color: #e53935; }
    .btn-color-black { background-color: #212121; color: #ffffff; border-color: #212121; }
    .btn-color-orange { background-color: #fb8c00; color: #ffffff; border-color: #fb8c00; }
    .btn-color-green { background-color: #43a047; color: #ffffff; border-color: #43a047; }
    .btn-color-cyan { background-color: #03a9f4; color: #ffffff; border-color: #03a9f4; }
    .btn-color-pink { background-color: #e91e63; color: #ffffff; border-color: #e91e63; }
    .btn-color-purple { background-color: #8e24aa; color: #ffffff; border-color: #8e24aa; }
    .btn-color-navy { background-color: #1a237e; color: #ffffff; border-color: #1a237e; }
    .btn-color-gray { background-color: #757575; color: #ffffff; border-color: #757575; }
    .btn-color-blue { background-color: #1e88e5; color: #ffffff; border-color: #1e88e5; }
    .btn-color-lightred { background-color: #ef5350; color: #ffffff; border-color: #ef5350; }

    .quiz-footer {
      margin-top: 20px;
    }

    .loading-container {
      text-align: center;
      padding: 40px 20px;
      font-size: 18px;
      font-weight: bold;
      color: #37a2b9;
    }

    .section-tabs {
      display: flex;
      gap: 15px;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 8px 12px;
      font-size: 16px;
      font-weight: bold;
      color: #888;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
    }
    .tab-btn.active {
      color: #e91e63;
      border-bottom-color: #e91e63;
    }

    .card {
      background: white;
      padding: 18px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 6px;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }
    .fav-btn {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: #ccc;
      transition: color 0.2s;
      padding: 0;
      line-height: 1;
    }
    .fav-btn.active {
      color: #ffca28;
    }
    .song-title {
      font-size: 18px;
      font-weight: bold;
      margin: 0;
    }
    .artist {
      color: #666;
      font-size: 14px;
      margin: 0 0 12px 0;
    }

    .embed-container {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 10px;
      background-color: #000;
    }
    .embed-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .listen-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background-color: #ff0000;
      color: white;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      transition: background-color 0.2s;
      white-space: nowrap;
    }
    .listen-btn:hover {
      background-color: #cc0000;
    }
  </style>
</head>
<body>

  <!-- かっこいいロゴ風タイトル -->
  <h1 class="logo-title" onclick="location.reload();">ボカ Search</h1>

  <!-- モード切り替えボタン -->
  <div class="mode-nav">
    <button class="mode-btn active" id="btn-mode-detail" onclick="switchMode('detail')">🔍 細かく検索</button>
    <button class="mode-btn" id="btn-mode-quiz" onclick="switchMode('quiz')">🤖 質問モード</button>
  </div>

  <!-- 【細かく検索モード】左右2カラムレイアウト -->
  <div id="layout-detail-mode" class="app-container">
    <div class="left-panel">
      <div class="search-box">
        <input type="text" id="keyword" placeholder="下のタグを選択してね！" readonly>
        <button class="search-btn" onclick="searchSongs()">リサーチ！</button>
      </div>

      <div class="word-panel-container">
        <div class="word-panel-title">探したい曲のタグを選んでね！</div>
        <div class="word-panel">
          <button class="chip" onclick="toggleWord('明るい', this)">明るい</button>
          <button class="chip" onclick="toggleWord('暗い', this)">暗い</button>
          <button class="chip" onclick="toggleWord('ノリノリ', this)">ノリノリ</button>
          <button class="chip" onclick="toggleWord('癒し', this)">癒し</button>
          <button class="chip" onclick="toggleWord('病み', this)">病み</button>
          <button class="chip" onclick="toggleWord('ダーク', this)">ダーク</button>
          <button class="chip" onclick="toggleWord('おしゃれ', this)">おしゃれ</button>
          <button class="chip" onclick="toggleWord('考察', this)">考察</button>
          <button class="chip" onclick="toggleWord('不思議', this)">不思議</button>
          <button class="chip" onclick="toggleWord('キラキラ', this)">キラキラ</button>
          <button class="chip" onclick="toggleWord('疾走感', this)">疾走感</button>
          <button class="chip" onclick="toggleWord('感動', this)">感動</button>
          <button class="chip" onclick="toggleWord('ネタ曲', this)">ネタ曲</button>
          <button class="chip" onclick="toggleWord('闇', this)">闇</button>
        </div>

        <div class="word-panel-title">ボーカルは？</div>
        <div class="word-panel">
          <button class="chip" onclick="toggleWord('初音ミク', this)">初音ミク</button>
          <button class="chip" onclick="toggleWord('重音テト', this)">重音テト</button>
          <button class="chip" onclick="toggleWord('Megpoid', this)">Megpoid</button>
          <button class="chip" onclick="toggleWord('鏡音リン', this)">鏡音リン</button>
          <button class="chip" onclick="toggleWord('鏡音レン', this)">鏡音レン</button>
          <button class="chip" onclick="toggleWord('可不', this)">可不</button>
          <button class="chip" onclick="toggleWord('歌愛ユキ', this)">歌愛ユキ</button>
          <button class="chip" onclick="toggleWord('v flower', this)">v flower</button>
          <button class="chip" onclick="toggleWord('足立レイ', this)">足立レイ</button>
          <button class="chip" onclick="toggleWord('雨衣', this)">雨衣</button>
        </div>
      </div>
    </div>

    <div class="right-panel">
      <div id="results-wrapper-detail" style="display: none;">
        <div class="section-tabs">
          <button class="tab-btn active" id="tab-recommend-detail" onclick="switchTab('recommend', 'detail')">✨ あなたへのおすすめ！</button>
          <button class="tab-btn" id="tab-favorite-detail" onclick="switchTab('favorite', 'detail')">★ お気に入り (<span class="fav-count">0</span>)</button>
        </div>
        <div id="recommend-section-detail">
          <div id="results-detail"></div>
        </div>
        <div id="favorite-section-detail" style="display: none;">
          <div id="fav-results-detail"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 【質問モード】中央配置レイアウト -->
  <div id="layout-quiz-mode" class="quiz-wrapper" style="display: none;">
    <div class="selected-tags-container" id="selected-tags-display"></div>

    <div class="quiz-container" id="quiz-card">
      <div class="quiz-question" id="quiz-question-text">どのボーカルの曲が聴きたい？</div>
      <div class="quiz-options" id="quiz-options-container"></div>
      <div class="quiz-footer" id="quiz-footer"></div>
    </div>

    <div id="quiz-loading" class="loading-container" style="display: none;">
      🔍 ぴったりなボカロ曲を探しているよ...
    </div>

    <div id="results-wrapper-quiz" style="display: none;">
      <div class="section-tabs">
        <button class="tab-btn active" id="tab-recommend-quiz" onclick="switchTab('recommend', 'quiz')">✨ あなたへのおすすめの曲はこちら！</button>
        <button class="tab-btn" id="tab-favorite-quiz" onclick="switchTab('favorite', 'quiz')">★ お気に入り (<span class="fav-count">0</span>)</button>
      </div>
      <div id="recommend-section-quiz">
        <div id="results-quiz"></div>
      </div>
      <div id="favorite-section-quiz" style="display: none;">
        <div id="fav-results-quiz"></div>
      </div>
    </div>
  </div>

  <script>
    // ★ご自身のGASのURLに書き換えてね！
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx_in3vx6PSBaWPxYBfo52d-Y9QulsKeYrZMTBeEP4cUDUO-JT7UOnDbk6YHqgOAJJb/exec";

    let favorites = JSON.parse(localStorage.getItem("voca_favorites") || "[]");
    updateFavCounts();

    // 分岐型質問ツリー構造
    const quizTree = {
      "q1": {
        question: "どのボーカルの曲が聴きたい？",
        options: [
          { label: "初音ミク！", tag: "初音ミク", next: "q2", colorClass: "btn-color-teal" },
          { label: "鏡音リン！", tag: "鏡音リン", next: "q2", colorClass: "btn-color-yellow" },
          { label: "重音テト！", tag: "重音テト", next: "q2", colorClass: "btn-color-red" },
          { label: "可不！", tag: "可不", next: "q2", colorClass: "btn-color-black" },
          { label: "だれでもOK！", tag: "", next: "q2", colorClass: "" },
          { label: "その他のボーカル", tag: "", next: "qb", colorClass: "" }
        ]
      },
      "qb": {
        question: "どのボーカルの曲が聴きたい？",
        options: [
          { label: "歌愛ユキ！", tag: "歌愛ユキ", next: "q2", colorClass: "btn-color-red" },
          { label: "足立レイ！", tag: "足立レイ", next: "q2", colorClass: "btn-color-orange" },
          { label: "GUMI！", tag: "Megpoid", next: "q2", colorClass: "btn-color-green" },
          { label: "やっぱり誰でもOK！", tag: "", next: "q2", colorClass: "" }
        ]
      },
      "q2": {
        question: "どんな曲が聴きたい？",
        options: [
          { label: "気持ちが明るくなる曲が聴きたい！", tag: "明るい", next: "q3a", colorClass: "btn-color-red" },
          { label: "暗めなかっこいい曲を聴きたい！", tag: "暗い", next: "q3b", colorClass: "btn-color-black" }
        ]
      },
      "q3a": {
        question: "どんな雰囲気の曲が聴きたい？",
        options: [
          { label: "気分がノリノリになる曲！", tag: "ノリノリ", next: "q4a", colorClass: "btn-color-red" },
          { label: "ゆったり癒される曲！", tag: "癒し", next: "q5", colorClass: "btn-color-cyan" }
        ]
      },
      "q3b": {
        question: "どんな雰囲気の曲が聴きたい？",
        options: [
          { label: "感情が乗せられている病み曲", tag: "病み", next: "q5", colorClass: "btn-color-pink" },
          { label: "世界観に浸れるダークな曲", tag: "ダーク", next: "q5", colorClass: "btn-color-black" },
          { label: "夜に聴きたいおしゃれな曲", tag: "おしゃれ", next: "q5", colorClass: "btn-color-purple" },
          { label: "曲を深く知りたい考察したくなる曲", tag: "考察", next: "q5", colorClass: "btn-color-navy" },
          { label: "音を楽しみたい不思議系な曲", tag: "不思議", next: "q5", colorClass: "btn-color-gray" },
          { label: "気持ちがノれるかっこいい曲", tag: "かっこいい", next: "q5", colorClass: "" }
        ]
      },
      "q4a": {
        question: "どんな曲を聴きたい気分？",
        options: [
          { label: "キラキラして明るい曲！", tag: "キラキラ", next: "q5", colorClass: "btn-color-yellow" },
          { label: "疾走感ある爽やかな曲！", tag: "疾走感", next: "q5", colorClass: "btn-color-blue" },
          { label: "心動かされる感動する曲！", tag: "感動", next: "q5", colorClass: "btn-color-orange" },
          { label: "笑っちゃう面白い曲！", tag: "ネタ曲", next: "q5", colorClass: "btn-color-lightred" },
          { label: "ちょっと闇を感じる曲！", tag: "闇", next: "q5", colorClass: "btn-color-black" }
        ]
      },
      "q5": {
        question: "どのくらい作品を調べたい？",
        options: [
          { label: "いろんなボカロPの作品が見たい！（1ボカロPにつき1作品）", filterProducer: true, next: "end", colorClass: "" },
          { label: "とにかくたくさんの作品を見たい！（すべての作品を表示）", filterProducer: false, next: "end", colorClass: "" }
        ]
      }
    };

    let currentQuestionKey = "q1";
    let quizHistory = [];
    let quizSelectedTags = [];
    let isFilterProducerOne = false;

    function switchMode(mode) {
      const btnDetail = document.getElementById("btn-mode-detail");
      const btnQuiz = document.getElementById("btn-mode-quiz");
      const layoutDetail = document.getElementById("layout-detail-mode");
      const layoutQuiz = document.getElementById("layout-quiz-mode");

      if (mode === 'detail') {
        btnDetail.classList.add("active");
        btnQuiz.classList.remove("active");
        layoutDetail.style.display = "flex";
        layoutQuiz.style.display = "none";
      } else {
        btnQuiz.classList.add("active");
        btnDetail.classList.remove("active");
        layoutDetail.style.display = "none";
        layoutQuiz.style.display = "block";
        
        resetQuiz();
      }
    }

    function resetQuiz() {
      currentQuestionKey = "q1";
      quizHistory = [];
      quizSelectedTags = [];
      isFilterProducerOne = false;
      document.getElementById("quiz-card").style.display = "block";
      document.getElementById("quiz-loading").style.display = "none";
      document.getElementById("results-wrapper-quiz").style.display = "none";
      renderSelectedTags();
      showQuizStep();
    }

    function renderSelectedTags() {
      const container = document.getElementById("selected-tags-display");
      if (quizSelectedTags.length === 0) {
        container.innerHTML = "";
        return;
      }

      const badgesHtml = quizSelectedTags.map(tag => `<span class="selected-tag-badge"># ${tag}</span>`).join("");
      
      let restartBtnHtml = "";
      if (document.getElementById("results-wrapper-quiz").style.display !== "none") {
        restartBtnHtml = `<button class="action-sub-btn" onclick="resetQuiz()">🔄 もう一度質問する</button>`;
      }

      container.innerHTML = `
        <div class="tag-badges-wrapper">${badgesHtml}</div>
        ${restartBtnHtml}
      `;
    }

    function showQuizStep() {
      if (currentQuestionKey === "end" || !quizTree[currentQuestionKey]) {
        executeQuizSearch();
        return;
      }

      const step = quizTree[currentQuestionKey];
      document.getElementById("quiz-question-text").innerText = step.question;

      const container = document.getElementById("quiz-options-container");
      container.innerHTML = "";

      step.options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "quiz-btn" + (opt.colorClass ? " " + opt.colorClass : "");
        btn.innerText = opt.label;
        btn.onclick = function() {
          quizHistory.push({
            key: currentQuestionKey,
            tag: opt.tag || null,
            filterProducer: opt.filterProducer !== undefined ? opt.filterProducer : null
          });

          if (opt.tag) quizSelectedTags.push(opt.tag);
          if (opt.filterProducer !== undefined) {
            isFilterProducerOne = opt.filterProducer;
          }

          renderSelectedTags();
          currentQuestionKey = opt.next;
          showQuizStep();
        };
        container.appendChild(btn);
      });

      const footer = document.getElementById("quiz-footer");
      footer.innerHTML = "";
      if (quizHistory.length > 0) {
        const backBtn = document.createElement("button");
        backBtn.className = "action-sub-btn";
        backBtn.innerText = "← ひとつ前に戻る";
        backBtn.onclick = goBackStep;
        footer.appendChild(backBtn);
      }
    }

    function goBackStep() {
      if (quizHistory.length === 0) return;

      const lastStep = quizHistory.pop();
      currentQuestionKey = lastStep.key;

      if (lastStep.tag) {
        const index = quizSelectedTags.lastIndexOf(lastStep.tag);
        if (index >= 0) quizSelectedTags.splice(index, 1);
      }

      renderSelectedTags();
      showQuizStep();
    }

    async function executeQuizSearch() {
      document.getElementById("quiz-card").style.display = "none";
      document.getElementById("quiz-loading").style.display = "block";
      document.getElementById("results-wrapper-quiz").style.display = "none";

      const searchKeywords = quizSelectedTags.length > 0 ? quizSelectedTags.join(" ") : "明るい";
      const resultsDiv = document.getElementById("results-quiz");
      const resultsWrapper = document.getElementById("results-wrapper-quiz");
      const loadingElem = document.getElementById("quiz-loading");

      switchTab('recommend', 'quiz');

      const keywords = searchKeywords.split(/\s+/).filter(k => k !== "");

      try {
        const response = await fetch(`${GAS_API_URL}?q=${encodeURIComponent(keywords[0])}`);
        let songs = await response.json();

        loadingElem.style.display = "none";
        resultsWrapper.style.display = "block";
        renderSelectedTags();

        if (!Array.isArray(songs) || songs.length === 0) {
          resultsDiv.innerHTML = "<p style='text-align:center;'>一致する楽曲が見つかりませんでした。</p>";
          return;
        }

        if (keywords.length > 1) {
          songs = songs.filter(song => {
            const songTags = song.tags ? song.tags.map(t => t.toLowerCase()) : [];
            return keywords.every(kw => {
              const kwLower = kw.toLowerCase();
              return songTags.some(tag => tag.includes(kwLower));
            });
          });
        }

        if (isFilterProducerOne && songs.length > 0) {
          const seenProducers = new Set();
          songs = songs.filter(song => {
            const artistName = song.artist ? song.artist.trim().toLowerCase() : "unknown";
            if (seenProducers.has(artistName)) {
              return false;
            }
            seenProducers.add(artistName);
            return true;
          });
        }

        if (songs.length === 0) {
          resultsDiv.innerHTML = "<p style='text-align:center;'>指定したすべての条件に一致する楽曲が見つかりませんでした。</p>";
          return;
        }

        renderSongList(songs, resultsDiv);

      } catch (error) {
        console.error("エラーが発生しました:", error);
        loadingElem.style.display = "none";
        resultsWrapper.style.display = "block";
        renderSelectedTags();
        resultsDiv.innerHTML = "<p style='text-align:center;'>検索中にエラーが発生しました。</p>";
      }
    }

    function toggleWord(word, element) {
      element.classList.remove("pyon");
      void element.offsetWidth;
      element.classList.add("pyon");

      const input = document.getElementById("keyword");
      let currentWords = input.value.trim() ? input.value.trim().split(/\s+/) : [];
      
      if (element.classList.contains("active")) {
        element.classList.remove("active");
        currentWords = currentWords.filter(w => w !== word);
      } else {
        element.classList.add("active");
        if (!currentWords.includes(word)) {
          currentWords.push(word);
        }
      }
      
      input.value = currentWords.join(" ");
    }

    function searchSongs() {
      const inputVal = document.getElementById("keyword").value.trim();
      if (!inputVal) return;

      const resultsDiv = document.getElementById("results-detail");
      const resultsWrapper = document.getElementById("results-wrapper-detail");
      
      switchTab('recommend', 'detail');
      resultsDiv.innerHTML = "検索中...";
      resultsWrapper.style.display = "block";

      const keywords = inputVal.split(/\s+/).filter(k => k !== "");

      fetch(`${GAS_API_URL}?q=${encodeURIComponent(keywords[0])}`)
        .then(res => res.json())
        .then(songs => {
          if (!Array.isArray(songs) || songs.length === 0) {
            resultsDiv.innerHTML = "<p>一致する楽曲が見つかりませんでした。</p>";
            return;
          }

          if (keywords.length > 1) {
            songs = songs.filter(song => {
              const songTags = song.tags ? song.tags.map(t => t.toLowerCase()) : [];
              return keywords.every(kw => {
                const kwLower = kw.toLowerCase();
                return songTags.some(tag => tag.includes(kwLower));
              });
            });
          }

          if (songs.length === 0) {
            resultsDiv.innerHTML = "<p>指定したすべての条件に一致する楽曲が見つかりませんでした。</p>";
            return;
          }

          renderSongList(songs, resultsDiv);
        })
        .catch(err => {
          console.error(err);
          resultsDiv.innerHTML = "<p>検索中にエラーが発生しました。</p>";
        });
    }

    function getEmbedHtml(url) {
      if (!url) return "";

      const ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
      if (ytMatch && ytMatch[1]) {
        return `
          <div class="embed-container">
            <iframe src="https://www.youtube.com/embed/${ytMatch[1]}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
        `;
      }

      const nicoMatch = url.match(/nicovideo\.jp\/watch\/((?:sm|so|nm)?\d+)/);
      if (nicoMatch && nicoMatch[1]) {
        const videoId = nicoMatch[1];
        return `
          <div class="embed-container">
            <iframe src="https://embed.nicovideo.jp/watch/${videoId}" allowfullscreen></iframe>
          </div>
        `;
      }

      return "";
    }

    function renderSongList(songList, container) {
      container.innerHTML = "";

      songList.forEach(song => {
        const card = document.createElement("div");
        card.className = "card";

        let targetUrl = song.url && song.url.trim().startsWith("http") ? song.url.trim() : "";
        if (!targetUrl) {
          const searchQuery = encodeURIComponent(`${song.title} ${song.artist}`);
          targetUrl = `https://www.youtube.com/results?search_query=${searchQuery}`;
        }

        const embedHtml = getEmbedHtml(targetUrl);

        const isFav = favorites.some(f => f.title === song.title && f.artist === song.artist);
        const favClass = isFav ? "active" : "";

        const cardHeader = document.createElement("div");
        cardHeader.className = "card-header";

        const titleGroup = document.createElement("div");
        titleGroup.className = "title-group";

        const favBtn = document.createElement("button");
        favBtn.className = `fav-btn ${favClass}`;
        favBtn.innerText = "★";
        favBtn.onclick = function() {
          toggleFavorite(song, targetUrl, favBtn);
        };

        const titleElem = document.createElement("h2");
        titleElem.className = "song-title";
        titleElem.innerText = song.title || "（タイトル不明）";

        titleGroup.appendChild(favBtn);
        titleGroup.appendChild(titleElem);

        const listenBtn = document.createElement("a");
        listenBtn.className = "listen-btn";
        listenBtn.href = targetUrl;
        listenBtn.target = "_blank";
        listenBtn.rel = "noopener noreferrer";
        listenBtn.innerText = "▶ 外部サイトで開く";

        cardHeader.appendChild(titleGroup);
        cardHeader.appendChild(listenBtn);

        const artistElem = document.createElement("p");
        artistElem.className = "artist";
        artistElem.innerText = song.artist || "";

        card.appendChild(cardHeader);
        card.appendChild(artistElem);
        
        if (embedHtml) {
          card.insertAdjacentHTML("beforeend", embedHtml);
        }

        container.appendChild(card);
      });
    }

    function toggleFavorite(song, targetUrl, btn) {
      const index = favorites.findIndex(f => f.title === song.title && f.artist === song.artist);
      if (index >= 0) {
        favorites.splice(index, 1);
        btn.classList.remove("active");
      } else {
        favorites.push({
          title: song.title,
          artist: song.artist,
          url: targetUrl
        });
        btn.classList.add("active");
      }
      localStorage.setItem("voca_favorites", JSON.stringify(favorites));
      updateFavCounts();

      const favDetail = document.getElementById("favorite-section-detail");
      const favQuiz = document.getElementById("favorite-section-quiz");

      if (favDetail.style.display !== "none") {
        renderSongList(favorites, document.getElementById("fav-results-detail"));
      }
      if (favQuiz.style.display !== "none") {
        renderSongList(favorites, document.getElementById("fav-results-quiz"));
      }
    }

    function updateFavCounts() {
      const countElems = document.querySelectorAll(".fav-count");
      countElems.forEach(elem => elem.innerText = favorites.length);
    }

    function switchTab(tabName, mode) {
      const suffix = mode === 'detail' ? '-detail' : '-quiz';
      const recTab = document.getElementById(`tab-recommend${suffix}`);
      const favTab = document.getElementById(`tab-favorite${suffix}`);
      const recSection = document.getElementById(`recommend-section${suffix}`);
      const favSection = document.getElementById(`favorite-section${suffix}`);

      if (tabName === 'recommend') {
        recTab.classList.add("active");
        favTab.classList.remove("active");
        recSection.style.display = "block";
        favSection.style.display = "none";
      } else {
        favTab.classList.add("active");
        recTab.classList.remove("active");
        favSection.style.display = "block";
        recSection.style.display = "none";

        const favResults = document.getElementById(`fav-results${suffix}`);
        if (favorites.length === 0) {
          favResults.innerHTML = "<p style='text-align:center;'>お気に入りに登録された楽曲はありません。</p>";
        } else {
          renderSongList(favorites, favResults);
        }
      }
    }
  </script>
