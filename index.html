<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOCA Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800;900&family=Poppins:wght@800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="logo-title" onclick="location.reload();">VOCA Search</h1>

  <div class="mode-nav">
    <button class="mode-btn active" id="btn-mode-quiz" onclick="switchMode('quiz')">🤖 質問モード</button>
    <button class="mode-btn" id="btn-mode-detail" onclick="switchMode('detail')">🔍 細かく検索</button>
  </div>

  <div id="layout-quiz-mode" class="quiz-wrapper">
    <div class="selected-tags-container" id="selected-tags-display"></div>

    <div class="quiz-container" id="quiz-card">
      <div class="quiz-question" id="quiz-question-text">今の気分にぴったりなボカロ曲を見つけよう！</div>
      <div class="quiz-options" id="quiz-options-container"></div>
      <div class="quiz-footer" id="quiz-footer"></div>
    </div>

    <div id="quiz-loading" class="loading-container" style="display: none;">
      🔍 ぴったりなボカロ曲を探しているよ...
    </div>

    <div id="results-wrapper-quiz" style="display: none;">
      <div class="section-tabs">
        <button class="tab-btn active" id="tab-recommend-quiz" onclick="switchTab('recommend', 'quiz')">✨ あなたへのおすすめの曲はこちら！</button>
        <button class="tab-btn" id="tab-favorite-quiz" onclick="switchTab('favorite', 'quiz')">★ お気に入り (<span class="fav-count">0</span>)</button>
      </div>
      <div id="recommend-section-quiz">
        <div id="results-quiz"></div>
      </div>
      <div id="favorite-section-quiz" style="display: none;">
        <div id="fav-results-quiz"></div>
      </div>
    </div>
  </div>

  <div id="layout-detail-mode" class="app-container" style="display: none;">
    <div class="left-panel centered" id="detail-left-panel">
      <div class="search-box">
        <input type="text" id="keyword" placeholder="下のタグを選択してね！" readonly>
        <button class="search-btn" onclick="searchSongs()">リサーチ！</button>
      </div>

      <div class="word-panel-container">
        <div class="word-panel-title">探したい曲のタグを選んでね！</div>
        <div class="word-panel">
          <button class="chip" onclick="toggleWord('明るい', this, '明るい')">明るい</button>
          <button class="chip" onclick="toggleWord('暗い', this, '暗い')">暗い</button>
          <button class="chip" onclick="toggleWord('ノリノリ', this, 'キラキラ')">ノリノリ</button>
          <button class="chip" onclick="toggleWord('癒し', this, '癒し')">癒し</button>
          <button class="chip" onclick="toggleWord('病み', this, '病み')">病み</button>
          <button class="chip" onclick="toggleWord('ダーク', this, 'ダーク')">ダーク</button>
          <button class="chip" onclick="toggleWord('おしゃれ', this, 'おしゃれ')">おしゃれ</button>
          <button class="chip" onclick="toggleWord('考察', this, '考察')">考察</button>
          <button class="chip" onclick="toggleWord('疾走感', this, '疾走感')">疾走感</button>
          <button class="chip" onclick="toggleWord('ネタ曲', this, 'ネタ曲')">ネタ曲</button>
          <button class="chip" onclick="toggleWord('感動', this, '感動')">感動</button>
          <button class="chip" onclick="toggleWord('かっこいい', this, 'かっこいい')">かっこいい</button>
        </div>

        <div class="word-panel-title">ボーカルは？</div>
        <div class="word-panel">
          <button class="chip" onclick="toggleWord('初音ミク', this, '初音ミク')">初音ミク</button>
          <button class="chip" onclick="toggleWord('鏡音リン', this, '鏡音リン')">鏡音リン</button>
          <button class="chip" onclick="toggleWord('鏡音レン', this, '鏡音レン')">鏡音レン</button>
          <button class="chip" onclick="toggleWord('重音テト', this, '重音テト')">重音テト</button>
          <button class="chip" onclick="toggleWord('巡音ルカ', this, '巡音ルカ')">巡音ルカ</button>
          <button class="chip" onclick="toggleWord('可不', this, '可不')">可不</button>
          <button class="chip" onclick="toggleWord('flower', this, 'flower')">flower</button>
          <button class="chip" onclick="toggleWord('GUMI', this, 'GUMI')">GUMI</button>
          <button class="chip" onclick="toggleWord('KAITO', this, 'KAITO')">KAITO</button>
          <button class="chip" onclick="toggleWord('MEIKO', this, 'MEIKO')">MEIKO</button>
          <button class="chip" onclick="toggleWord('足立レイ', this, '足立レイ')">足立レイ</button>
          <button class="chip" onclick="toggleWord('可愛ユキ', this, '可愛ユキ')">可愛ユキ</button>
        </div>

        <div class="word-panel-title">世界観は？</div>
        <div class="word-panel">
          <button class="chip" onclick="toggleWord('独自の世界観', this, '独自の世界観')">独自の世界観</button>
          <button class="chip" onclick="toggleWord('ストーリーが良い', this, 'ストーリーに感動')">ストーリーが良い</button>
          <button class="chip" onclick="toggleWord('歌詞に共感', this, '歌詞に共感')">歌詞に共感</button>
          <button class="chip" onclick="toggleWord('聴いてて楽しい', this, '聴いてて楽しい')">聴いてて楽しい</button>
        </div>

        <div class="word-panel-title">どんなシチュエーションで聴きたい？</div>
        <div class="word-panel">
          <button class="chip" onclick="toggleWord('通勤・通学中に', this, '通勤・通学中')">通勤・通学中に</button>
          <button class="chip" onclick="toggleWord('部屋で一人', this, '')">部屋で一人</button>
          <button class="chip" onclick="toggleWord('今気分を上げたい！時', this, '気分を上げたい時')">今気分を上げたい！時</button>
          <button class="chip" onclick="toggleWord('お昼の散歩しながら', this, 'お昼の散歩')">お昼の散歩しながら</button>
          <button class="chip" onclick="toggleWord('気持ちい朝に', this, '朝')">気持ちい朝に</button>
          <button class="chip" onclick="toggleWord('作業中のお供に', this, '作業中')">作業中のお供に</button>
          <button class="chip" onclick="toggleWord('深夜にピッタリな曲を…', this, '深夜徘徊')">深夜にピッタリな曲を…</button>
        </div>

        <div class="word-panel-title">再生数は？</div>
        <div class="word-panel">
          <button class="chip" onclick="toggleWord('100万再生以上', this, '100万以上')">100万再生以上</button>
          <button class="chip" onclick="toggleWord('10万再生～100万再生', this, '10万以上')">10万再生～100万再生</button>
        </div>

        <div class="word-panel-title">投稿時期は？</div>
        <div class="detail-year-group">
          <select id="detail-start-year" class="detail-year-dropdown"></select>
          <span>～</span>
          <select id="detail-end-year" class="detail-year-dropdown"></select>
        </div>

      </div>
    </div>

    <div class="right-panel" id="detail-right-panel" style="display: none;">
      <div id="results-wrapper-detail">
        <div class="section-tabs">
          <button class="tab-btn active" id="tab-recommend-detail" onclick="switchTab('recommend', 'detail')">✨ あなたへのおすすめ！</button>
          <button class="tab-btn" id="tab-favorite-detail" onclick="switchTab('favorite', 'detail')">★ お気に入り (<span class="fav-count">0</span>)</button>
        </div>
        <div id="recommend-section-detail">
          <div id="results-detail"></div>
        </div>
        <div id="favorite-section-detail" style="display: none;">
          <div id="fav-results-detail"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
