<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ボカ Search</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f7f9fb;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #37a2b9;
      font-size: 32px;
      margin-bottom: 30px;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #37a2b9;
      border-radius: 8px;
      outline: none;
      background-color: #ffffff;
      color: #555;
      cursor: default;
    }
    button.search-btn {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      background-color: #37a2b9;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    button.search-btn:hover {
      background-color: #2c8396;
    }
    button.search-btn:active {
      transform: scale(0.95);
    }
    
    .word-panel-container {
      margin-bottom: 30px;
    }
    .word-panel-title {
      font-size: 14px;
      font-weight: bold;
      color: #555;
      margin-bottom: 12px;
    }
    .word-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    @keyframes bounce {
      0% { transform: scale(1); }
      30% { transform: scale(1.25, 0.75); }
      50% { transform: scale(0.85, 1.15) translateY(-6px); }
      70% { transform: scale(1.05, 0.95) translateY(0); }
      100% { transform: scale(1); }
    }

    .chip {
      background-color: #ffffff;
      color: #37a2b9;
      border: 2px solid #37a2b9;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }
    .chip:hover {
      background-color: #eef7f9;
    }
    .chip.active {
      background-color: #37a2b9;
      color: #ffffff;
    }
    .chip.pyon {
      animation: bounce 0.4s ease;
    }

    .results-header {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #e91e63;
    }
    .card {
      background: white;
      padding: 18px 20px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .song-title {
      font-size: 18px;
      font-weight: bold;
      margin: 0 0 5px 0;
    }
    .artist {
      color: #666;
      font-size: 14px;
      margin: 0 0 12px 0;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .tag {
      background-color: #eef7f9;
      color: #2c8396;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    .listen-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background-color: #ff0000;
      color: white;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    .listen-btn:hover {
      background-color: #cc0000;
    }
  </style>
</head>
<body>

  <h1>ボカ Search</h1>

  <div class="search-box">
    <input type="text" id="keyword" placeholder="下のタグを選択してね！" readonly>
    <button class="search-btn" onclick="searchSongs()">リサーチ！</button>
  </div>

  <div class="word-panel-container">
    <div class="word-panel-title">探したい曲のタグを選んでね！</div>
    <div class="word-panel">
      <button class="chip" onclick="toggleWord('明るい', this)">明るい</button>
      <button class="chip" onclick="toggleWord('暗い', this)">暗い</button>
      <button class="chip" onclick="toggleWord('遅い', this)">遅い</button>
      <button class="chip" onclick="toggleWord('速い', this)">早い</button>
      <button class="chip" onclick="toggleWord('かっこいい', this)">かっこいい</button>
      <button class="chip" onclick="toggleWord('かわいい', this)">かわいい</button>
      <button class="chip" onclick="toggleWord('ピンク', this)">ピンク</button>
      <button class="chip" onclick="toggleWord('ダーク', this)">ダーク</button>
      <button class="chip" onclick="toggleWord('おしゃれ', this)">おしゃれ</button>
      <button class="chip" onclick="toggleWord('爽やか', this)">爽やか</button>
      <button class="chip" onclick="toggleWord('落ち着く', this)">落ち着く</button>
      <button class="chip" onclick="toggleWord('ノリノリ', this)">ノリノリ</button>
      <button class="chip" onclick="toggleWord('デュエット', this)">デュエット</button>
      <button class="chip" onclick="toggleWord('大人数', this)">大人数</button>
      <button class="chip" onclick="toggleWord('ロック', this)">ロック</button>
      <button class="chip" onclick="toggleWord('バズった', this)">バズった</button>
      <button class="chip" onclick="toggleWord('界隈で話題', this)">界隈で話題</button>
      <button class="chip" onclick="toggleWord('おもしろい', this)">おもしろい</button>
      <button class="chip" onclick="toggleWord('EDM', this)">EDM</button>
      <button class="chip" onclick="toggleWord('感動', this)">感動</button>
      <button class="chip" onclick="toggleWord('病み', this)">病み</button>
    </div>
  </div>

  <div id="recommend-section" style="display: none;">
    <div class="results-header">✨ あなたへのおすすめ！</div>
    <div id="results"></div>
  </div>

  <script>
    // ★ご自身のGASのURLに書き換えてね！
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbw2YfbaCChPv7HHpIU27lvwcoyr1q5pzDsQ_tgDPvATRRDj2KaGvZIqG3tNV5jGbg7N/exec";

    function toggleWord(word, element) {
      element.classList.remove("pyon");
      void element.offsetWidth;
      element.classList.add("pyon");

      const input = document.getElementById("keyword");
      let currentWords = input.value.trim() ? input.value.trim().split(/\s+/) : [];
      
      if (element.classList.contains("active")) {
        element.classList.remove("active");
        currentWords = currentWords.filter(w => w !== word);
      } else {
        element.classList.add("active");
        if (!currentWords.includes(word)) {
          currentWords.push(word);
        }
      }
      
      input.value = currentWords.join(" ");
    }

    async function searchSongs() {
      const inputVal = document.getElementById("keyword").value.trim();
      if (!inputVal) return;

      const resultsDiv = document.getElementById("results");
      const recommendSection = document.getElementById("recommend-section");
      
      resultsDiv.innerHTML = "検索中...";
      recommendSection.style.display = "block";

      const keywords = inputVal.split(/\s+/).filter(k => k !== "");

      try {
        const response = await fetch(`${GAS_API_URL}?q=${encodeURIComponent(keywords[0])}`);
        let songs = await response.json();

        if (!Array.isArray(songs) || songs.length === 0) {
          resultsDiv.innerHTML = "<p>一致する楽曲が見つかりませんでした。</p>";
          return;
        }

        if (keywords.length > 1) {
          songs = songs.filter(song => {
            const songTags = song.tags.map(t => t.toLowerCase());
            return keywords.every(kw => {
              const kwLower = kw.toLowerCase();
              return songTags.some(tag => tag.includes(kwLower));
            });
          });
        }

        resultsDiv.innerHTML = "";

        if (songs.length === 0) {
          resultsDiv.innerHTML = "<p>指定したすべての条件に一致する楽曲が見つかりませんでした。</p>";
          return;
        }

        songs.forEach(song => {
          const card = document.createElement("div");
          card.className = "card";

          const tagsHtml = song.tags.map(t => `<span class="tag">#${t}</span>`).join("");
          
          // D列にURLがある場合はそのURLを使用、なければYouTube検索URLを生成
          let targetUrl = song.url && song.url.trim().startsWith("http") ? song.url.trim() : "";
          if (!targetUrl) {
            const searchQuery = encodeURIComponent(`${song.title} ${song.artist}`);
            targetUrl = `https://www.youtube.com/results?search_query=${searchQuery}`;
          }

          card.innerHTML = `
            <h2 class="song-title">${song.title || "（タイトル不明）"}</h2>
            <p class="artist">${song.artist || ""}</p>
            <div class="card-footer">
              <div class="tag-container">${tagsHtml}</div>
              <a href="${targetUrl}" target="_blank" rel="noopener noreferrer" class="listen-btn">
                ▶ 楽曲を聴く
              </a>
            </div>
          `;
          resultsDiv.appendChild(card);
        });

      } catch (error) {
        console.error("エラーが発生しました:", error);
        resultsDiv.innerHTML = "<p>検索中にエラーが発生しました。</p>";
      }
    }
  </script>

</body>
</html>
