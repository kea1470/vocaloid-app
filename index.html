<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ボカ Search</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f7f9fb;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #37a2b9;
      font-size: 32px;
      margin-bottom: 30px;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #37a2b9;
      border-radius: 8px;
      outline: none;
      background-color: #ffffff;
      color: #555;
      cursor: default;
    }
    button.search-btn {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      background-color: #37a2b9;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }
    button.search-btn:hover {
      background-color: #2c8396;
    }
    button.search-btn:active {
      transform: scale(0.95);
    }
    
    .word-panel-container {
      margin-bottom: 30px;
    }
    .word-panel-title {
      font-size: 14px;
      font-weight: bold;
      color: #555;
      margin-bottom: 10px;
      margin-top: 15px;
    }
    .word-panel-title:first-child {
      margin-top: 0;
    }
    .word-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    @keyframes bounce {
      0% { transform: scale(1); }
      30% { transform: scale(1.25, 0.75); }
      50% { transform: scale(0.85, 1.15) translateY(-6px); }
      70% { transform: scale(1.05, 0.95) translateY(0); }
      100% { transform: scale(1); }
    }

    .chip {
      background-color: #ffffff;
      color: #37a2b9;
      border: 2px solid #37a2b9;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }
    .chip:hover {
      background-color: #eef7f9;
    }
    .chip.active {
      background-color: #37a2b9;
      color: #ffffff;
    }
    .chip.pyon {
      animation: bounce 0.4s ease;
    }

    .section-tabs {
      display: flex;
      gap: 15px;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 20px;
    }
    .tab-btn {
      padding: 8px 16px;
      font-size: 18px;
      font-weight: bold;
      color: #888;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
    }
    .tab-btn.active {
      color: #e91e63;
      border-bottom-color: #e91e63;
    }

    .card {
      background: white;
      padding: 18px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 6px;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }
    .fav-btn {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: #ccc;
      transition: color 0.2s, transform 0.1s;
      padding: 0;
      line-height: 1;
    }
    .fav-btn.active {
      color: #ffca28;
    }
    .fav-btn:active {
      transform: scale(1.3);
    }
    .song-title {
      font-size: 18px;
      font-weight: bold;
      margin: 0;
    }
    .artist {
      color: #666;
      font-size: 14px;
      margin: 0 0 12px 0;
    }
    .thumbnail-container {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 10px;
      background-color: #eee;
      max-height: 280px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .thumbnail-img {
      width: 100%;
      height: auto;
      object-fit: cover;
      display: block;
    }
    .listen-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background-color: #ff0000;
      color: white;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      transition: background-color 0.2s;
      white-space: nowrap;
    }
    .listen-btn:hover {
      background-color: #cc0000;
    }
  </style>
</head>
<body>

  <h1>ボカ Search</h1>

  <div class="search-box">
    <input type="text" id="keyword" placeholder="下のタグを選択してね！" readonly>
    <button class="search-btn" onclick="searchSongs()">リサーチ！</button>
  </div>

  <div class="word-panel-container">
    <div class="word-panel-title">探したい曲のタグを選んでね！</div>
    <div class="word-panel">
      <button class="chip" onclick="toggleWord('明るい', this)">明るい</button>
      <button class="chip" onclick="toggleWord('暗い', this)">暗い</button>
      <button class="chip" onclick="toggleWord('遅い', this)">遅い</button>
      <button class="chip" onclick="toggleWord('早い', this)">早い</button>
      <button class="chip" onclick="toggleWord('かっこいい', this)">かっこいい</button>
      <button class="chip" onclick="toggleWord('かわいい', this)">かわいい</button>
      <button class="chip" onclick="toggleWord('ピンク', this)">ピンク</button>
      <button class="chip" onclick="toggleWord('ダーク', this)">ダーク</button>
      <button class="chip" onclick="toggleWord('おしゃれ', this)">おしゃれ</button>
      <button class="chip" onclick="toggleWord('爽やか', this)">爽やか</button>
      <button class="chip" onclick="toggleWord('落ち着く', this)">落ち着く</button>
      <button class="chip" onclick="toggleWord('ノリノリ', this)">ノリノリ</button>
      <button class="chip" onclick="toggleWord('デュエット', this)">デュエット</button>
      <button class="chip" onclick="toggleWord('大人数', this)">大人数</button>
      <button class="chip" onclick="toggleWord('ロック', this)">ロック</button>
      <button class="chip" onclick="toggleWord('バズった', this)">バズった</button>
      <button class="chip" onclick="toggleWord('界隈で話題', this)">界隈で話題</button>
      <button class="chip" onclick="toggleWord('おもしろい', this)">おもしろい</button>
      <button class="chip" onclick="toggleWord('EDM', this)">EDM</button>
      <button class="chip" onclick="toggleWord('感動', this)">感動</button>
      <button class="chip" onclick="toggleWord('病み', this)">病み</button>
    </div>

    <div class="word-panel-title">ボーカルは？</div>
    <div class="word-panel">
      <button class="chip" onclick="toggleWord('初音ミク', this)">初音ミク</button>
      <button class="chip" onclick="toggleWord('重音テト', this)">重音テト</button>
    </div>
  </div>

  <div id="results-wrapper" style="display: none;">
    <div class="section-tabs">
      <button class="tab-btn active" id="tab-recommend" onclick="switchTab('recommend')">✨ あなたへのおすすめ！</button>
      <button class="tab-btn" id="tab-favorite" onclick="switchTab('favorite')">★ お気に入り (<span id="fav-count">0</span>)</button>
    </div>

    <div id="recommend-section">
      <div id="results"></div>
    </div>

    <div id="favorite-section" style="display: none;">
      <div id="fav-results"></div>
    </div>
  </div>

  <script>
    // ★ご自身のGASのURLに書き換えてね！
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbx_in3vx6PSBaWPxYBfo52d-Y9QulsKeYrZMTBeEP4cUDUO-JT7UOnDbk6YHqgOAJJb/exec";

    let favorites = JSON.parse(localStorage.getItem("voca_favorites") || "[]");
    updateFavCount();

    // タグ選択アニメーション＆入力エリアへの反映
    function toggleWord(word, element) {
      element.classList.remove("pyon");
      void element.offsetWidth;
      element.classList.add("pyon");

      const input = document.getElementById("keyword");
      let currentWords = input.value.trim() ? input.value.trim().split(/\s+/) : [];
      
      if (element.classList.contains("active")) {
        element.classList.remove("active");
        currentWords = currentWords.filter(w => w !== word);
      } else {
        element.classList.add("active");
        if (!currentWords.includes(word)) {
          currentWords.push(word);
        }
      }
      
      input.value = currentWords.join(" ");
    }

    async function searchSongs() {
      const inputVal = document.getElementById("keyword").value.trim();
      if (!inputVal) return;

      const resultsDiv = document.getElementById("results");
      const resultsWrapper = document.getElementById("results-wrapper");
      
      switchTab('recommend');
      resultsDiv.innerHTML = "検索中...";
      resultsWrapper.style.display = "block";

      const keywords = inputVal.split(/\s+/).filter(k => k !== "");

      try {
        const response = await fetch(`${GAS_API_URL}?q=${encodeURIComponent(keywords[0])}`);
        let songs = await response.json();

        if (!Array.isArray(songs) || songs.length === 0) {
          resultsDiv.innerHTML = "<p>一致する楽曲が見つかりませんでした。</p>";
          return;
        }

        if (keywords.length > 1) {
          songs = songs.filter(song => {
            const songTags = song.tags ? song.tags.map(t => t.toLowerCase()) : [];
            return keywords.every(kw => {
              const kwLower = kw.toLowerCase();
              return songTags.some(tag => tag.includes(kwLower));
            });
          });
        }

        if (songs.length === 0) {
          resultsDiv.innerHTML = "<p>指定したすべての条件に一致する楽曲が見つかりませんでした。</p>";
          return;
        }

        renderSongList(songs, resultsDiv);

      } catch (error) {
        console.error("エラーが発生しました:", error);
        resultsDiv.innerHTML = "<p>検索中にエラーが発生しました。</p>";
      }
    }

    function getYoutubeId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    function renderSongList(songList, container) {
      container.innerHTML = "";

      songList.forEach(song => {
        const card = document.createElement("div");
        card.className = "card";

        let targetUrl = song.url && song.url.trim().startsWith("http") ? song.url.trim() : "";
        if (!targetUrl) {
          const searchQuery = encodeURIComponent(`${song.title} ${song.artist}`);
          targetUrl = `https://www.youtube.com/results?search_query=${searchQuery}`;
        }

        const youtubeId = getYoutubeId(targetUrl);
        let thumbnailHtml = "";
        if (youtubeId) {
          thumbnailHtml = `
            <div class="thumbnail-container">
              <img class="thumbnail-img" src="https://img.youtube.com/vi/${youtubeId}/hqdefault.jpg" alt="${song.title}">
            </div>
          `;
        }

        const isFav = favorites.some(f => f.title === song.title && f.artist === song.artist);
        const favClass = isFav ? "active" : "";

        // 要素を動的に生成してイベントを設定
        const cardHeader = document.createElement("div");
        cardHeader.className = "card-header";

        const titleGroup = document.createElement("div");
        titleGroup.className = "title-group";

        const favBtn = document.createElement("button");
        favBtn.className = `fav-btn ${favClass}`;
        favBtn.innerText = "★";
        favBtn.onclick = function() {
          toggleFavorite(song, targetUrl, favBtn);
        };

        const titleElem = document.createElement("h2");
        titleElem.className = "song-title";
        titleElem.innerText = song.title || "（タイトル不明）";

        titleGroup.appendChild(favBtn);
        titleGroup.appendChild(titleElem);

        const listenBtn = document.createElement("a");
        listenBtn.className = "listen-btn";
        listenBtn.href = targetUrl;
        listenBtn.target = "_blank";
        listenBtn.rel = "noopener noreferrer";
        listenBtn.innerText = "▶ 楽曲を聴く";

        cardHeader.appendChild(titleGroup);
        cardHeader.appendChild(listenBtn);

        const artistElem = document.createElement("p");
        artistElem.className = "artist";
        artistElem.innerText = song.artist || "";

        card.appendChild(cardHeader);
        card.appendChild(artistElem);
        if (thumbnailHtml) {
          card.insertAdjacentHTML("beforeend", thumbnailHtml);
        }

        container.appendChild(card);
      });
    }

    function toggleFavorite(song, targetUrl, btn) {
      const index = favorites.findIndex(f => f.title === song.title && f.artist === song.artist);
      if (index >= 0) {
        favorites.splice(index, 1);
        btn.classList.remove("active");
      } else {
        favorites.push({
          title: song.title,
          artist: song.artist,
          url: targetUrl
        });
        btn.classList.add("active");
      }
      localStorage.setItem("voca_favorites", JSON.stringify(favorites));
      updateFavCount();

      if (document.getElementById("favorite-section").style.display !== "none") {
        renderSongList(favorites, document.getElementById("fav-results"));
      }
    }

    function updateFavCount() {
      document.getElementById("fav-count").innerText = favorites.length;
    }

    function switchTab(tabName) {
      const recTab = document.getElementById("tab-recommend");
      const favTab = document.getElementById("tab-favorite");
      const recSection = document.getElementById("recommend-section");
      const favSection = document.getElementById("favorite-section");

      if (tabName === 'recommend') {
        recTab.classList.add("active");
        favTab.classList.remove("active");
        recSection.style.display = "block";
        favSection.style.display = "none";
      } else {
        favTab.classList.add("active");
        recTab.classList.remove("active");
        favSection.style.display = "block";
        recSection.style.display = "none";

        const favResults = document.getElementById("fav-results");
        if (favorites.length === 0) {
          favResults.innerHTML = "<p>お気に入りに登録された楽曲はありません。</p>";
        } else {
          renderSongList(favorites, favResults);
        }
      }
    }
  </script>

</body>
</html>
